[project]
name = "ragman"
version = "0.1.0"
description = "Agentic RAG pipeline builder"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "chromadb>=0.5",
    "redis[hiredis]>=5.0",
    "langchain-text-splitters>=0.3",
    "sentence-transformers>=3.0",
    "openai>=1.50",
    "anthropic>=0.34",
    "rank-bm25>=0.2",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "cohere>=5.0",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "aiofiles>=24.0",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "tiktoken>=0.7",
    "arq>=0.25",
    "umap-learn>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
