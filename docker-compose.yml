networks:
  ragman-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  chroma-data:
  ollama-models:

services:

  # ── FastAPI application ───────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      chroma:
        condition: service_started
      ollama:
        condition: service_started
    networks:
      - ragman-net
    restart: unless-stopped

  # ── ARQ worker ───────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "arq", "app.worker.settings.WorkerSettings"]
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - ragman-net
    restart: unless-stopped

  # ── PostgreSQL + pgvector ─────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ragman
      POSTGRES_USER: ragman
      POSTGRES_PASSWORD: ragman
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragman -d ragman"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ragman-net
    restart: unless-stopped

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    networks:
      - ragman-net
    restart: unless-stopped

  # ── ChromaDB ──────────────────────────────────────────────────────────────
  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma-data:/chroma/chroma
    environment:
      CHROMA_SERVER_AUTHN_PROVIDER: ""
      ALLOW_RESET: "true"
    networks:
      - ragman-net
    restart: unless-stopped

  # ── Ollama ────────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - ragman-net
    restart: unless-stopped
